name: Update Org Profile

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build profile README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_readme.py

      # registry 驱动的项目段落。渲染器在数据源仓库 qdriven/innate-apps 那边，
      # 这里只负责跑它。两边改的是不同的标记块（project_list / org_stats /
      # recent_releases vs innate_apps），互不覆盖。
      - uses: actions/checkout@v4
        with:
          repository: qdriven/innate-apps
          path: innate-apps-src
          clean: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render registry-driven project section
        run: |
          node innate-apps-src/scripts/render-profile.mjs \
            --registry innate-apps-src/registry/apps.json \
            --out profile/README.md \
            --profile org

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "docs: update variableway project list [skip ci]"
          git push
